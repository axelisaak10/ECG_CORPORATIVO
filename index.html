<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/assets/logos/Corporativo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ECG - Centro de Ingeniería y Abastecimiento</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              'ecg-negro': '#000000',
              'ecg-celeste': '#037bab',
              'ecg-azul': '#1b5795',
              'ecg-rojo1': '#9f0f0b',
              'ecg-rojo2': '#9f100c',
              'ecg-gris': '#a6a6a6',
              'ecg-gris-claro': '#d1d0d1',
              'ecg-blanco': '#ffffff'
            },
            animation: {
              'fadeIn': 'fadeIn 0.3s ease-out',
              'slideUp': 'slideUp 0.4s ease-out',
            },
            keyframes: {
              fadeIn: {
                '0%': { opacity: '0' },
                '100%': { opacity: '1' },
              },
              slideUp: {
                '0%': { opacity: '0', transform: 'translateY(20px)' },
                '100%': { opacity: '1', transform: 'translateY(0)' },
              },
            },
          }
        }
      }
    </script>
    <style>
      @keyframes slideUpModal {
        0% { opacity: 0; transform: translateY(40px) scale(0.95); }
        100% { opacity: 1; transform: translateY(0) scale(1); }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
